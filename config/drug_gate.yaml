# Target-presence gate for disease x drug lists (scripts/79b_target_gate.py; user 2026-10-09).
# Gene classes come from HGNC gene groups in the pinned HGNC snapshot (config/datasets.yaml: hgnc), not ad hoc lists.
# Every disease x drug row records which rule decided it (gate_reason).

expression:
  tpm_min: 1.0          # a tumor expresses a gene at TPM >= tpm_min (Toil TPM, primary_per_patient tumors)
  min_fraction: 0.20    # a gene is expressed in a disease if >= min_fraction of its tumors express it
                        # (subset-level: a target present in a fifth of patients keeps the drug)

adme:
  # Drug-handling genes (metabolism, conjugation, transport) are never used as gate targets: their absence says
  # nothing about whether the drug can act. A drug whose only annotated targets are ADME genes -> adme_only (passes).
  hgnc_group_ids:
    - 1000   # Cytochrome P450 family 1 (CYP1A1, CYP1A2, CYP1B1)
    - 1001   # Cytochrome P450 family 2 (CYP2C9, CYP2C19, CYP2D6, ...)
    - 1002   # Cytochrome P450 family 3 (CYP3A4, CYP3A5, ...)
             # other CYP families are not ADME (CYP17A1, CYP19A1, CYP11 are drug targets)
    - 363    # UDP glucuronosyltransferases
    - 762    # Sulfotransferases, cytosolic
    - 1133   # Arylamine N-acetyltransferases (NAT1, NAT2)
    - 1667   # Flavin containing monooxygenases
    - 567    # Soluble glutathione S-transferases
    - 1469   # Microsomal glutathione S-transferases
    - 461    # Carboxylesterases
    - 2173   # Solute carrier family 22 (OCT / OAT drug transporters)
    - 2216   # Solute carrier organic anion transporter family (OATPs)
  genes: [ABCB1, ABCC1, ABCC2, ABCC3, ABCG2]   # drug efflux pumps (whole ABC subfamilies include non-ADME genes)

family:
  # A target that is not expressed is rescued if another member of one of its HGNC gene groups is expressed
  # (annotations often name one isoform of a pan-isoform drug). Only specific groups count.
  # Off (user 2026-10-09): drugs should be specific to their annotated receptor / target (limit off-target binding);
  # HGNC groups also mix receptor subtypes with different pharmacology and include complexes.
  enabled: false
  max_group_size: 15
  min_group_size: 2

receptor_gate:
  # Receptor evidence gate (scripts/79w_receptor_gate.py; user 2026-11-02). Unit = cohort / subgroup x drug x receptor
  # target that passed the target gate above. It decides whether the receptor counts as the drug's receptor in that
  # cohort; it never removes a drug from the rankings.
  receptor_families:     # HGNC gene-group roots (with all descendants) that define a receptor class; first match wins
    GPCR: [139]
    nuclear receptor: [71]
    receptor tyrosine kinase: [321]
    receptor Ser/Thr kinase: [344]
    ligand-gated ion channel: [161]
    cytokine / immune receptor: [602, 599, 782, 948, 2120]
    integrin: [597]
    other ion channel: [177]
  kinase_family: 3432    # HGNC "Kinases": targets in it use the kinase potency cut
  binding:
    pchembl_min: 6.0           # 1 uM: best valid ChEMBL pChEMBL (Ki / Kd / IC50 / EC50) on the target
    pchembl_min_kinase: 7.0    # 100 nM for kinase targets, also when ChEMBL lists the kinase as a curated mechanism
    # A curated ChEMBL mechanism (direct_interaction = 1) counts for non-kinase targets when its target is a single
    # protein, complex, complex group or chimeric protein. PROTEIN FAMILY / SELECTIVITY GROUP mechanisms give no
    # member-level credit (no family rescue, as in the target gate).
    mechanism_target_types: [SINGLE PROTEIN, PROTEIN COMPLEX, PROTEIN COMPLEX GROUP, CHIMERIC PROTEIN]
  # D110: a CHIMERIC PROTEIN mechanism target counts in 79i2 only through the kinase the drug binds (the fusion partner
  # has no binding site and is made in almost every tissue). ChEMBL target pref_name -> gene. 79i2 stops on an unmapped one.
  chimeric_kinase:
    "Bcr/Abl fusion protein": ABL1
    "EML4-ALK": ALK
    "NPM/ALK (Nucleophosmin/ALK tyrosine kinase receptor)": ALK
  assembly:
    # A gene whose curated mechanism target is a complex is judged as that complex (tumors and lines):
    # PROTEIN COMPLEX: all components expressed, except these (any component; homodimers are functional)
    any_component: ["Platelet-derived growth factor receptor"]
    # complex groups: name prefix -> required subunit classes (one expressed member per class)
    groups:
      "GABA-A": [[GABRA], [GABRB], [GABRG, GABRD, GABRE, GABRQ, GABRP]]
      "Glutamate receptor ionotropic AMPA": any
  assay_lines:
    tpm_min: 1.0               # DepMap 24Q4 log2(TPM+1) >= 1
    min_weighted_fraction: 0.5 # over the lines 79e used for this cohort x drug (direct: in-key, Celligner weights;
                               # borrowed: out-of-key, equal weights)
    # Passes resting on one matched line are kept and flagged (single_line; user 2026-11-02).

standin:
  # Closest-compound stand-ins (scripts/79y_standin.py; user 2026-11-02). Fixed before looking at results.
  # Pair = an FDA drug and another LINCS compound. Similarity = mean over their shared profiled lines of the Pearson
  # correlation of their line-specific regulator activity (CollecTRI, context-free; 79d drug_viper_specific_collectri).
  min_shared_lines: 2
  min_similarity: 0.4
  require_shared_target: true   # >= 1 shared annotated non-ADME target (LINCS / Repurposing Hub; the gate's ADME list)
  shared_target_evidence: chembl  # user 2026-11-02: the shared annotated target must be ChEMBL-backed for both compounds
                                 # (receptor_gate.binding rule: curated mechanism or pChEMBL >= 6; kinases >= 7);
                                 # "annotation" = annotation overlap only (the first version, C27)
  # Use: in a cohort, a compound tested in the cohort's matched lines (direct, no unmatched_lines flag) stands in for a
  # close FDA drug that was only borrowed or is weak evidence there, and vice versa the page lists, for each such
  # compound, its closest FDA drugs. A stand-in is reported next to the drug's own score, never replaces it.
  # Validation (adopt only if met): pairs where both are direct and unflagged in the same cohort; Spearman of
  # spec_mech percentile (stand-in vs drug's own) >= 0.3 and its 95% bootstrap CI above the same statistic for random
  # shared-target pairs (no similarity rule).
  validation:
    min_spearman: 0.3
    n_boot: 1000
